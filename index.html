<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Raport Siswa Realtime - Google Sheets Backend</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html-docx-js for Client-Side Word (.docx) Generation -->
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: white;
        }
        .sticky-col-header {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #065f46;
        }
        @media print {
            body { background: white !important; }
            no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ADMIN_PASSWORD_HASH = "@SMPN38BDL";

        // URL Google Apps Script Web App default yang sudah dikonfigurasi permanen sesuai permintaan Anda
        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHLaP52afO6OlT2qB_DnZTI0AywYHHm9Phao3Efcziad9enlZJJCjGaDinKEUIN_SPQw/exec";

        const LIST_MAPEL = [
            "BAHASA INDONESIA",
            "MATEMATIKA",
            "PJOK",
            "IPS",
            "BAHASA INGGRIS",
            "IPA",
            "PRAKARYA",
            "PAI",
            "PAK",
            "BAHASA LAMPUNG",
            "INFORMATIKA",
            "PENDIDIKAN PANCASILA"
        ];

        const RAW_SISWA = [
            { nama: "ADE EVA KINANTI", nisn: "3129411935 / 885" },
            { nama: "ADINDA SHEFA RHAMADANI", nisn: "3127863650 / 914" },
            { nama: "AHMAD RAIHAN", nisn: "3122114250 / 856" },
            { nama: "Alvino Ridwan Pratama", nisn: "3125344952 / 918" },
            { nama: "AMANDA AFRILIA", nisn: "3131304403 / 824" },
            { nama: "CAHYA BR SINAMBELA", nisn: "3134737824 / 862" },
            { nama: "DARWAN ALVIANSYAH", nisn: "3118785290 / 828" },
            { nama: "DIAN APRILIA PUTRI", nisn: "0131953770 / 774" },
            { nama: "Ghlora Noe Kheyla", nisn: "3124582037 / 924" },
            { nama: "Haikal Pratama", nisn: "3133700552 / 897" },
            { nama: "HOLIK AKBAR", nisn: "0112101455 / 805" },
            { nama: "IQBAL HIDAYATULLOH", nisn: "3129498244 / 834" },
            { nama: "JUNI PRATAMA", nisn: "0134723977 / 777" },
            { nama: "Kafa Jehsen Cristian", nisn: "3123487042 / 836" },
            { nama: "M. ARIFIN", nisn: "0139786472 / 780" },
            { nama: "M. KHAIRUL AZZAM", nisn: "3127703195 / 867" },
            { nama: "MINAFA ADZKIA MALVIN", nisn: "0129245373 / 785" },
            { nama: "Muhamad Alfatih Suherman", nisn: "3136389666 / 931" },
            { nama: "MUHAMMAD REVAN ABI PRATAMA", nisn: "3139087706 / 873" },
            { nama: "MUHAMMAD RIDHO SAPUTRA", nisn: "3137282405 / 842" },
            { nama: "Naila Azzahra Sopyan", nisn: "0131511541 / 817" },
            { nama: "NAUFAL SHIDQI ARLIS", nisn: "3133773381 / 908" },
            { nama: "Nirmala Nia Putri", nisn: "3133142931 / 936" },
            { nama: "POLIN MANURUNG", nisn: "3126649207 / 877" },
            { nama: "RAYSHA SESALIA WATTY", nisn: "3137634731 / 791" },
            { nama: "RYAN DWI ISNANTO", nisn: "0136957159 / 879" },
            { nama: "SALWA NABILA PUTRI", nisn: "0138991945 / 848" },
            { nama: "SILSILA FADILA", nisn: "0126877999 / 944" },
            { nama: "SUCI MASNAWATI", nisn: "3133626364 / 943" },
            { nama: "Syami Ahmad Azzanky", nisn: "0135342382 / 852" },
            { nama: "ZAHRA ANYA RACHMA LAKSONO", nisn: "3132548482 / 913" }
        ];

        const DEFAULT_SISWA = RAW_SISWA.map(item => item.nama.toUpperCase());
        const NISN_MAP = RAW_SISWA.reduce((acc, item) => {
            acc[item.nama.toUpperCase()] = item.nisn;
            return acc;
        }, {});

        function App() {
            const [activeTab, setActiveTab] = useState('input');
            const [selectedMapel, setSelectedMapel] = useState(LIST_MAPEL[0]);
            const [gradesData, setGradesData] = useState({});
            
            const [scriptUrl, setScriptUrl] = useState(() => {
                return localStorage.getItem('smpn38_script_url') || DEFAULT_SCRIPT_URL;
            });
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [tempScriptUrl, setTempScriptUrl] = useState(scriptUrl);
            
            const [logoKota, setLogoKota] = useState("https://upload.wikimedia.org/wikipedia/commons/e/ed/Logo_Kota_Bandar_Lampung_%28Tangkai_Padi_dan_Kapas%29.png");
            const [logoSekolah, setLogoSekolah] = useState("https://upload.wikimedia.org/wikipedia/commons/e/ed/Logo_Kota_Bandar_Lampung_%28Tangkai_Padi_dan_Kapas%29.png");
            
            const [loading, setLoading] = useState(false);
            const [statusMessage, setStatusMessage] = useState({ type: 'info', text: 'Menghubungkan ke Google Sheets (Realtime Backend)...' });
            
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [adminError, setAdminError] = useState('');

            const [showSingleModal, setShowSingleModal] = useState(false);
            const [selectedSiswaSingle, setSelectedSiswaSingle] = useState(DEFAULT_SISWA[0]);
            const [isWordGenerating, setIsWordGenerating] = useState(false);
            const [isBulkWordGenerating, setIsBulkWordGenerating] = useState(false);
            const [bulkProgress, setBulkProgress] = useState({ current: 0, total: 0 });
            const [attendance, setAttendance] = useState({ sakit: '', ijin: '', alpa: '' });
            
            const debouncedTimeoutRef = useRef(null);
            const pollingIntervalRef = useRef(null);

            const getInitialGrades = () => {
                const initial = {};
                DEFAULT_SISWA.forEach(nama => {
                    initial[nama] = {};
                    LIST_MAPEL.forEach(mapel => {
                        initial[nama][mapel] = { ph1: '', ph2: '', pts: '' };
                    });
                });
                return initial;
            };

            const fetchGradesFromSheet = async (isSilent = false) => {
                if (!scriptUrl) {
                    if (!isSilent) {
                        setGradesData(getInitialGrades());
                        setStatusMessage({ type: 'error', text: 'URL Google Apps Script belum tersedia.' });
                    }
                    return;
                }

                try {
                    const response = await fetch(scriptUrl);
                    const result = await response.json();
                    if (result && result.grades) {
                        setGradesData(result.grades);
                        if (!isSilent) {
                            setStatusMessage({ type: 'success', text: 'Berhasil terhubung dan tersinkronisasi otomatis dengan Google Sheets!' });
                            setTimeout(() => setStatusMessage({ type: '', text: '' }), 3000);
                        }
                    } else if (!isSilent) {
                        setGradesData(getInitialGrades());
                        setStatusMessage({ type: 'info', text: 'Spreadsheet kosong. Memulai dengan data kosong.' });
                    }
                } catch (err) {
                    console.warn("Fetch sheets error:", err);
                    if (!isSilent && Object.keys(gradesData).length === 0) {
                        setGradesData(getInitialGrades());
                        // Fallback aman jika script URL belum di-deploy aktif oleh pengguna, tetap berikan data awal agar aplikasi berjalan mulus
                        setStatusMessage({ type: 'info', text: 'Mode Lokal Aktif (Silakan atur URL Spreadsheet Anda jika ingin sinkronisasi online).' });
                    }
                }
            };

            useEffect(() => {
                fetchGradesFromSheet();
                // Polling real-time setiap 4 detik agar siapa pun yang membuka link melihat perubahan secara live
                pollingIntervalRef.current = setInterval(() => {
                    fetchGradesFromSheet(true);
                }, 4000);

                return () => {
                    if (pollingIntervalRef.current) clearInterval(pollingIntervalRef.current);
                };
            }, [scriptUrl]);

            const updateRemoteGrades = async (newGrades) => {
                if (!scriptUrl || scriptUrl.includes("AKfycbz...")) return;

                try {
                    await fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ grades: newGrades })
                    });
                } catch (err) {
                    console.warn("Error posting to Google Sheets:", err);
                }
            };

            const handleGradeChange = (nama, mapel, field, value) => {
                if (value !== '') {
                    const num = Number(value);
                    if (isNaN(num) || num < 0 || num > 100) return;
                }

                setGradesData(prev => {
                    const updated = {
                        ...prev,
                        [nama]: {
                            ...prev[nama],
                            [mapel]: {
                                ...prev[nama]?.[mapel],
                                [field]: value
                            }
                        }
                    };

                    if (debouncedTimeoutRef.current) clearTimeout(debouncedTimeoutRef.current);
                    debouncedTimeoutRef.current = setTimeout(() => {
                        updateRemoteGrades(updated);
                    }, 400);

                    return updated;
                });
            };

            const handleManualSync = async () => {
                setLoading(true);
                setStatusMessage({ type: 'info', text: 'Menyimpan & Menyinkronkan nilai ke Google Sheets...' });
                await updateRemoteGrades(gradesData);
                await fetchGradesFromSheet(true);
                setTimeout(() => {
                    setLoading(false);
                    setStatusMessage({ type: 'success', text: 'Berhasil disinkronkan ke semua perangkat via Google Sheets!' });
                    setTimeout(() => setStatusMessage({ type: '', text: '' }), 3000);
                }, 600);
            };

            const handleSaveSettings = (e) => {
                e.preventDefault();
                setScriptUrl(tempScriptUrl);
                localStorage.setItem('smpn38_script_url', tempScriptUrl);
                setShowSettingsModal(false);
                setStatusMessage({ type: 'success', text: 'URL Google Apps Script berhasil diperbarui!' });
                setTimeout(() => setStatusMessage({ type: '', text: '' }), 3000);
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === ADMIN_PASSWORD_HASH) {
                    setIsAdminAuthenticated(true);
                    setShowAdminModal(false);
                    setAdminPassword('');
                    setAdminError('');
                    setActiveTab('admin');
                } else {
                    setAdminError('Password salah!');
                }
            };

            const handleLogoUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    const result = uploadEvent.target.result;
                    if (type === 'kota') setLogoKota(result);
                    else if (type === 'sekolah') setLogoSekolah(result);
                };
                reader.readAsDataURL(file);
            };

            const exportToExcel = () => {
                const rekapRows = [];
                rekapRows.push(["MASTER REKAP NILAI RAPORT SISWA REALTIME (GOOGLE SHEETS)"]);
                rekapRows.push([`Diexport pada: ${new Date().toLocaleString()}`]);
                rekapRows.push([]);

                const headerRow1 = ["NO", "NAMA SISWA"];
                LIST_MAPEL.forEach(mapel => headerRow1.push(mapel, "", ""));
                rekapRows.push(headerRow1);

                const headerRow2 = ["", ""];
                LIST_MAPEL.forEach(() => headerRow2.push("PH 1", "PH 2", "PTS"));
                rekapRows.push(headerRow2);

                DEFAULT_SISWA.forEach((nama, idx) => {
                    const rowData = [idx + 1, nama];
                    LIST_MAPEL.forEach(mapel => {
                        const score = gradesData[nama]?.[mapel] || { ph1: '', ph2: '', pts: '' };
                        rowData.push(score.ph1 !== '' ? Number(score.ph1) : '');
                        rowData.push(score.ph2 !== '' ? Number(score.ph2) : '');
                        rowData.push(score.pts !== '' ? Number(score.pts) : '');
                    });
                    rekapRows.push(rowData);
                });

                const ws = XLSX.utils.aoa_to_sheet(rekapRows);
                if (!ws['!merges']) ws['!merges'] = [];
                ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 2 + (LIST_MAPEL.length * 3) - 1 } });
                ws['!merges'].push({ s: { r: 1, c: 0 }, e: { r: 1, c: 2 + (LIST_MAPEL.length * 3) - 1 } });

                LIST_MAPEL.forEach((mapel, index) => {
                    const startCol = 2 + (index * 3);
                    ws['!merges'].push({ s: { r: 3, c: startCol }, e: { r: 3, c: startCol + 2 } });
                });

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Master Rekap Nilai");
                XLSX.writeFile(wb, "Master_Rekap_Nilai_Raport_Sheets.xlsx");
            };

            const getWordHtmlString = (targetSiswa) => {
                const subjects = [
                    { no: "1", name: "Pendidikan Agama dan Budi Pekerti", key: "PAI" },
                    { no: "2", name: "Pendidikan Pancasila dan Kewarganegaraan", key: "PENDIDIKAN PANCASILA" },
                    { no: "3", name: "Bahasa Indonesia", key: "BAHASA INDONESIA" },
                    { no: "4", name: "Matematika", key: "MATEMATIKA" },
                    { no: "5", name: "Ilmu Pengetahuan Alam", key: "IPA" },
                    { no: "6", name: "Ilmu Pengetahuan Sosial", key: "IPS" },
                    { no: "7", name: "Bahasa Inggris", key: "BAHASA INGGRIS" },
                    { no: "8", name: "Pend Jasmani Olah Raga dan Kesehatan", key: "PJOK" },
                    { no: "9", name: "Informatika", key: "INFORMATIKA" },
                    { no: "10", name: "Seni Budaya & Prakarya", key: "PRAKARYA" },
                    { no: "11", name: "Muatan Lokal", key: "__mulok__", isHeader: true },
                    { no: "a.", name: "Bahasa Lampung", key: "BAHASA LAMPUNG", isSub: true },
                    { no: "b.", name: "Pendidikan Anti Korupsi", key: "PAK", isSub: true }
                ];

                let rowsHtml = '';
                subjects.forEach((item) => {
                    if (item.isHeader) {
                        rowsHtml += `
                            <tr>
                                <td style="border: 1px solid #000; padding: 4px; text-align: center; background-color: #f1f5f9; font-weight: bold;">11</td>
                                <td style="border: 1px solid #000; padding: 4px; background-color: #f1f5f9; font-weight: bold;" colspan="5">Muatan Lokal</td>
                            </tr>
                        `;
                    } else {
                        const score = gradesData[targetSiswa]?.[item.key] || { ph1: '', ph2: '', pts: '' };
                        const ph1 = score.ph1 !== '' ? Number(score.ph1) : '';
                        const ph2 = score.ph2 !== '' ? Number(score.ph2) : '';
                        const pts = score.pts !== '' ? Number(score.pts) : '';
                        const valid = [ph1, ph2, pts].filter(v => typeof v === 'number' && !isNaN(v));
                        const avg = valid.length > 0 ? (valid.reduce((a, b) => a + b, 0) / valid.length).toFixed(1) : '';
                        const paddingLeft = item.isSub ? 'padding-left: 15px;' : '';

                        rowsHtml += `
                            <tr>
                                <td style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10pt;">${item.no}</td>
                                <td style="border: 1px solid #000; padding: 4px; font-size: 10pt; ${paddingLeft}">${item.name}</td>
                                <td style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10pt;">${ph1}</td>
                                <td style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10pt;">${ph2}</td>
                                <td style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10pt;">${pts}</td>
                                <td style="border: 1px solid #000; padding: 4px; text-align: center; font-size: 10pt; font-weight: bold;">${avg}</td>
                            </tr>
                        `;
                    }
                });

                const sVal = Number(attendance.sakit || 0);
                const iVal = Number(attendance.ijin || 0);
                const aVal = Number(attendance.alpa || 0);
                const totalVal = sVal + iVal + aVal;
                const targetNisn = NISN_MAP[targetSiswa] || "-";

                return `
                    <div style="font-family: Arial, sans-serif; font-size: 11pt; color: #000000; margin-bottom: 30px;">
                        <table style="width: 100%; border-collapse: collapse; border-bottom: 3px double #000; margin-bottom: 10px; padding-bottom: 5px;">
                            <tr>
                                <td style="width: 15%; text-align: center; vertical-align: middle;">
                                    <img src="${logoKota}" width="50" height="60" style="object-fit: contain;" />
                                </td>
                                <td style="width: 70%; text-align: center; vertical-align: middle;">
                                    <p style="margin: 0; font-size: 11pt; font-weight: bold;">DINAS PENDIDIKAN DAN KEBUDAYAAN</p>
                                    <p style="margin: 2px 0; font-size: 13pt; font-weight: bold;">SMP NEGERI 38 BANDAR LAMPUNG</p>
                                    <p style="margin: 0; font-size: 9pt; font-style: italic;">Jl. Ikan Sembilang No. 16 Sukaraja - Bumi Waras Kode Pos. 35226</p>
                                    <p style="margin: 2px 0; font-size: 10pt; font-weight: bold;">BANDAR LAMPUNG</p>
                                </td>
                                <td style="width: 15%; text-align: center; vertical-align: middle;">
                                    <img src="${logoSekolah}" width="55" height="55" style="object-fit: contain;" />
                                </td>
                            </tr>
                        </table>
                        <div style="text-align: center; margin-bottom: 15px;">
                            <p style="margin: 0; font-size: 11pt; font-weight: bold;">LAPORAN HASIL PEMBELAJARAN SUMATIF TENGAH SEMESTER GANJIL</p>
                            <p style="margin: 2px 0; font-size: 10pt; font-weight: bold;">TAHUN PELAJARAN 2026/2027</p>
                        </div>
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 10pt;">
                            <tr>
                                <td style="width: 15%; padding: 2px 0; font-weight: bold;">Nama Siswa</td>
                                <td style="width: 2%; padding: 2px 0;">:</td>
                                <td style="width: 48%; padding: 2px 0; font-weight: bold;">${targetSiswa}</td>
                                <td style="width: 15%; padding: 2px 0; font-weight: bold;">Kelas</td>
                                <td style="width: 2%; padding: 2px 0;">:</td>
                                <td style="width: 18%; padding: 2px 0;">8.C</td>
                            </tr>
                            <tr>
                                <td style="padding: 2px 0; font-weight: bold;">NISN</td>
                                <td style="padding: 2px 0;">:</td>
                                <td style="padding: 2px 0;">${targetNisn}</td>
                                <td style="padding: 2px 0; font-weight: bold;">Semester</td>
                                <td style="padding: 2px 0;">:</td>
                                <td style="padding: 2px 0;">Ganjil</td>
                            </tr>
                        </table>
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 10pt;">
                            <thead>
                                <tr style="background-color: #f8fafc; text-align: center; font-weight: bold;">
                                    <th style="border: 1px solid #000; padding: 5px; width: 6%;">NO</th>
                                    <th style="border: 1px solid #000; padding: 5px; text-align: left; width: 44%;">MATA PELAJARAN</th>
                                    <th style="border: 1px solid #000; padding: 5px; width: 13%;">PENILAIAN HARIAN 1</th>
                                    <th style="border: 1px solid #000; padding: 5px; width: 13%;">PENILAIAN HARIAN 2</th>
                                    <th style="border: 1px solid #000; padding: 5px; width: 14%;">PENILAIAN TENGAH SEMESTER</th>
                                    <th style="border: 1px solid #000; padding: 5px; width: 10%;">RATA-RATA</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                        <table style="width: 50%; border-collapse: collapse; margin-bottom: 25px; font-size: 10pt;">
                            <thead>
                                <tr style="background-color: #f8fafc; text-align: center; font-weight: bold;">
                                    <th style="border: 1px solid #000; padding: 4px;" colspan="5">Kehadiran</th>
                                </tr>
                                <tr style="background-color: #f8fafc; text-align: center; font-weight: bold;">
                                    <td style="border: 1px solid #000; padding: 4px;">Sakit</td>
                                    <td style="border: 1px solid #000; padding: 4px;">Ijin</td>
                                    <td style="border: 1px solid #000; padding: 4px;">Alpa</td>
                                    <td style="border: 1px solid #000; padding: 4px;" colspan="2">Jumlah</td>
                                </tr>
                            </thead>
                            <tbody>
                                <tr style="text-align: center; font-weight: bold;">
                                    <td style="border: 1px solid #000; padding: 4px;">${sVal}</td>
                                    <td style="border: 1px solid #000; padding: 4px;">${iVal}</td>
                                    <td style="border: 1px solid #000; padding: 4px;">${aVal}</td>
                                    <td style="border: 1px solid #000; padding: 4px;" colspan="2">${totalVal}</td>
                                </tr>
                            </tbody>
                        </table>
                        <table style="width: 100%; border-collapse: collapse; font-size: 10pt;">
                            <tr>
                                <td style="width: 50%; vertical-align: top;">
                                    <p style="margin: 0;">Mengetahui,</p>
                                    <p style="margin: 0; font-weight: bold;">Orang Tua / Wali Siswa</p>
                                    <br/><br/><br/>
                                    <p style="margin: 0; font-weight: bold;">( .................................................... )</p>
                                </td>
                                <td style="width: 50%; vertical-align: top; text-align: right;">
                                    <p style="margin: 0;">Bandar Lampung, 09 Oktober 2026</p>
                                    <p style="margin: 0; font-weight: bold;">Wali Kelas 8.C</p>
                                    <br/><br/><br/>
                                    <p style="margin: 0; font-weight: bold; text-decoration: underline;">ROSLINA, S.Pd.,Gr.</p>
                                    <p style="margin: 0;">NIP 198510142021212004</p>
                                </td>
                            </tr>
                        </table>
                    </div>
                `;
            };

            const downloadWordReport = () => {
                setIsWordGenerating(true);
                try {
                    const innerContent = getWordHtmlString(selectedSiswaSingle);
                    const htmlContent = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Raport STS</title></head><body>${innerContent}</body></html>`;

                                            <option key={nama} value={nama}>{nama}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                            <div className="bg-white text-black p-4 font-sans text-xs max-w-[210mm] mx-auto box-border border border-slate-200 rounded-lg mb-4 max-h-[350px] overflow-y-auto" dangerouslySetInnerHTML={{ __html: getWordHtmlString(selectedSiswaSingle) }} />

                            <div className="flex gap-2">
                                <button type="button" onClick={() => setShowSingleModal(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold py-2.5 rounded-xl">Batal</button>
                                <button type="button" onClick={downloadWordReport} disabled={isWordGenerating} className="flex-1 bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold py-2.5 rounded-xl shadow-sm flex items-center justify-center gap-2">
                                    {isWordGenerating ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-download"></i>}
                                    <span>Download File Word (.docx)</span>
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                <footer className="mt-auto py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white">
                        <p>© 2026 Sistem Raport Siswa Realtime (Google Sheets) • SMP Negeri 38 Bandar Lampung</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
